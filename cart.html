<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>السلة | BookNest</title>
    <link
      href="vendor/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="vendor/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="vendor/google-fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top-bar">
      <div class="container d-flex justify-content-between align-items-center">
        <span><i class="bi bi-telephone ms-2"></i>+967 770434482</span
        ><span class="social-icons"
          ><a href="#"><i class="bi bi-facebook"></i></a
          ><a href="#"><i class="bi bi-instagram"></i></a
          ><a href="#"><i class="bi bi-twitter"></i></a
        ></span>
      </div>
    </div>
    <nav class="navbar navbar-top bg-white shadow-sm">
      <div class="container navbar-top-inner">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
          ><img src="images/sample logo 1.png" alt="BookNest" width="44" /><span
            >Book<span class="brand-accent">Nest</span></span
          ></a
        >
        <div class="nav-top-actions">
          <a href="account.html" class="nav-link nav-action-btn"
            ><i class="bi bi-person"></i><span>حسابي</span></a
          >
          <a
            href="wishlist.html"
            class="nav-link nav-action-btn"
            aria-label="المفضلة"
            ><i class="bi bi-heart"></i
            ><span class="badge-count" id="wishlistCount"></span
          ></a>
          <a
            href="cart.html"
            class="nav-link nav-action-btn cart-link"
            aria-label="السلة"
            ><i class="bi bi-bag"></i
            ><span class="badge-count" id="cartCount"></span
          ></a>
        </div>
      </div>
    </nav>
    <nav class="section-nav" aria-label="التنقل الرئيسي">
      <div class="container">
        <ul class="navbar-nav main-menu">
          <li>
            <a class="nav-link" href="index.html"
              ><i class="bi bi-house-door"></i><span>الرئيسية</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="books.html"
              ><i class="bi bi-book"></i><span>الكتب</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="about.html"
              ><i class="bi bi-info-circle"></i><span>من نحن</span></a
            >
          </li>
          <li>
            <a class="nav-link" href="contact.html"
              ><i class="bi bi-chat-dots"></i><span>اتصل بنا</span></a
            >
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section id="cart" class="section-pad page-panel page-section">
        <div class="container">
          <div class="section-heading">
            <div>
              <span class="eyebrow">مشترياتك</span>
              <h1>سلة المشتريات</h1>
            </div>
            <span class="muted" id="cartSummary"></span>
          </div>
          <div class="row g-4">
            <div class="col-lg-8" id="cartItems"></div>
            <div class="col-lg-4">
              <div class="summary-card">
                <h3>ملخص الطلب</h3>
                <div class="summary-line">
                  <span>المجموع الفرعي</span><strong id="subtotal">0 RY</strong>
                </div>
                <div class="summary-line">
                  <span>الشحن</span><strong id="shipping">0 RY</strong>
                </div>
                <hr />
                <div class="summary-line total">
                  <span>الإجمالي</span><strong id="total">0 RY</strong>
                </div>
                <button class="btn btn-primary w-100 mt-3" id="checkoutBtn">
                  المتابعة لإتمام الشراء
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div
        class="container d-flex flex-wrap justify-content-between align-items-center gap-3"
      >
        <a class="navbar-brand" href="index.html"
          >Book<span class="brand-accent">Nest</span></a
        ><span>© 2026 BookNest. جميع الحقوق محفوظة.</span>
        <div>
          <a href="books.html">الكتب</a><a href="about.html">من نحن</a
          ><a href="contact.html">تواصل معنا</a>
        </div>
      </div>
    </footer>
    <div id="toast" class="toast-message"></div>
    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
